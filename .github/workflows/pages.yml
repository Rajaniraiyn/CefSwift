name: Website

# Builds www/ (pages assembled from docs/*.md and www/pages/) and deploys it
# to GitHub Pages. Pull requests build and validate without deploying.
on:
  push:
    branches: [main]
    paths: ['www/**', 'docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['www/**', 'docs/**', '.github/workflows/pages.yml']
  release:
    types: [published]  # the changelog page lists releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Install
        working-directory: www
        run: bun install --frozen-lockfile
      - name: Validate links
        working-directory: www
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run validate
      - name: Build and audit
        working-directory: www
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run build
          bun run audit
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: www/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
