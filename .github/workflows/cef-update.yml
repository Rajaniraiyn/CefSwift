# Keeps the pinned CEF on the newest stable release.
#
# Twice a week this runs Scripts/update-cef.py. When CEF has moved, it opens
# (or refreshes) a pull request that merges itself once CI is green.
#
# Repository setup, once:
#   - Settings → General → enable "Allow auto-merge".
#   - Protect `main` with the `ci` job as a required status check.
#   - Settings → Actions → General → allow Actions to create pull requests.
#   - Optional: variable CEF_UPDATE_COAUTHOR ("Name <email>") to change who
#     is credited as co-author of the update commits.
name: CEF Update

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: cef-update
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  COAUTHOR: ${{ vars.CEF_UPDATE_COAUTHOR || 'Rajaniraiyn <Rajaniraiyn@users.noreply.github.com>' }}

jobs:
  update:
    runs-on: macos-15   # the C bridge is generated with Apple clang
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Update to the newest stable CEF
        id: cef
        run: Scripts/update-cef.py

      - name: Commit and push
        if: steps.cef.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create cef-update
          git add CEF_VERSION.json Sources/CCef
          git commit \
            --message "Update CEF to ${{ steps.cef.outputs.new }}" \
            --message "From ${{ steps.cef.outputs.old }}." \
            --message "Co-authored-by: ${COAUTHOR}"
          git push --force origin cef-update

      - name: Open or refresh the pull request
        if: steps.cef.outputs.updated == 'true'
        run: |
          TITLE="Update CEF to ${{ steps.cef.outputs.new }}"
          if gh pr view cef-update --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit cef-update --title "$TITLE" --body-file .cef/update-summary.md
          else
            gh pr create --base main --head cef-update --title "$TITLE" --body-file .cef/update-summary.md
          fi
          # Pull requests opened with the workflow token do not trigger other
          # workflows, so start CI for the branch explicitly.
          gh workflow run ci.yml --ref cef-update
          gh pr merge cef-update --auto --squash
