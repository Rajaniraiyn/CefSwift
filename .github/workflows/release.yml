# Tag-driven release. Push a `v*` tag and this creates a GitHub Release with
# generated notes. SwiftPM consumers resolve the tag itself, so there are no
# assets to build or upload.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # create the release
    steps:
      # No checkout: gh works from the API, and --verify-tag fails if the tag
      # is not on GitHub.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
