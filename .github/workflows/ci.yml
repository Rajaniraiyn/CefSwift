# Builds, tests, audits the C bridge, bundles SelfTest and runs it against the
# real Chromium. Also the gate for the auto-merged CEF update pull requests,
# which start it with workflow_dispatch (docs/automation.md).
#
# Cost notes (keep this cheap):
#   - One full macos-15 (arm64) job, `ci`. The label selects the macOS 15
#     image family; GitHub updates that image (Xcode, tools) in place every
#     week or two, so a run can change without a commit here. The
#     "Toolchain" step prints what each run used.
#   - One short job beside it, in parallel and without CEF: `intel`
#     compiles everything for x86_64 on the same arm64 runner.
#   - Only the minimal arm64 CEF flavor is downloaded, and `.cef/downloads`
#     (~135 MB) is cached keyed on the pinned CEF version.
#
# What this verifies, and what it does not (docs/automation.md#ci):
#   - Everything compiles against the macOS 14 deployment target that
#     Package.swift declares. Nothing runs on macOS 14: GitHub no longer
#     offers a macOS 14 runner. Tests and SelfTest run on macOS 15.
#   - Everything compiles for Intel; nothing runs on Intel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the job name "ci": it is the required status check that gates the
    # auto-merged CEF update pull requests.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read the pinned CEF version
        id: cef
        run: |
          version="$(jq -r .cef CEF_VERSION.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "framework=$GITHUB_WORKSPACE/.cef/dist/${version}_macosarm64_minimal/Release/Chromium Embedded Framework.framework" >> "$GITHUB_OUTPUT"

      # Offline checks of the update logic (release selection, manifest,
      # archive extraction, API-version handling).
      - name: Update script self-test
        run: Scripts/update-cef.py --self-test

      # Same key as the update workflow saves, so an update branch restores
      # the archive that workflow already downloaded.
      - name: Cache CEF downloads
        uses: actions/cache@v4
        with:
          path: .cef/downloads
          key: cef-${{ steps.cef.outputs.version }}-macosarm64-minimal

      - name: Download CEF (minimal, arm64)
        run: |
          swift package \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef download

      # The generated bridge must match the vendored headers, and every
      # function it binds must be exported by the framework it will load —
      # a mismatch would otherwise abort at first call.
      - name: C bridge matches the headers and the framework
        run: Scripts/generate-bindings.py --check --framework "${{ steps.cef.outputs.framework }}"

      - name: Build
        run: swift build --build-tests

      # The package's deployment target reaches the built code: availability
      # checking above was against macOS 14.
      - name: Deployment target is macOS 14
        run: |
          xcrun vtool -show-build .build/debug/cefswift-helper | tee "$RUNNER_TEMP/build-version.txt"
          grep -Eq 'minos 14\.0$' "$RUNNER_TEMP/build-version.txt"

      # With the framework's path, the loader tests run instead of skipping.
      - name: Test
        env:
          CEF_FRAMEWORK_PATH: ${{ steps.cef.outputs.framework }}
        run: swift test

      # The unit tests again under Thread Sanitizer and Address Sanitizer.
      # They never start Chromium; the loader tests skip without the
      # framework's path.
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread

      # The default build system links the C helper-startup dylib without
      # the ASan runtime (undefined ___asan_* symbols); the native one
      # links it.
      - name: Test with Address Sanitizer
        run: swift test --sanitize=address --build-system native

      # Every Swift sample in README.md and docs/ compiles against this
      # checkout, for macOS 14.
      - name: Documentation samples compile
        run: Scripts/check-doc-samples.py

      # In release, as cef bundle builds below: it then only relinks SelfTest
      # instead of compiling CefSwift and the examples a second time.
      - name: Build examples
        run: swift build --package-path Examples --configuration release

      # The plugin keeps its cache in the invoking package's .cef/, so the
      # Examples package would download the same archive again; give it a
      # copy-on-write clone of the one already here.
      - name: Bundle SelfTest
        run: |
          mkdir -p Examples/.cef
          cp -Rc .cef/downloads Examples/.cef/
          swift package --package-path Examples \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef bundle --product SelfTest --configuration release --output dist

      - name: The bundle passes cef doctor
        run: |
          swift package --package-path Examples \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef doctor dist/SelfTest.app

      # Runs every end-to-end check against the real Chromium runtime, each
      # group in a process of its own; the app exits with the number of
      # failed checks. SELFTEST_STRICT makes a skip for a reason of the
      # environment (offline, window not visible) a failure, since this
      # runner's environment is under our control. FAIL and SKIP lines go
      # to the run summary.
      - name: SelfTest
        shell: bash
        env:
          SELFTEST_ISOLATED: "1"
          SELFTEST_STRICT: "1"
          # What a hosted runner, a virtual machine, cannot run: frame rates
          # that follow a display's refresh, and FairPlay playback.
          SELFTEST_EXPECTED_SKIPS: "frames: ;compatibility: an offscreen page gets animation frames;system engine: FairPlay playback"
          SELFTEST_JSON: ${{ runner.temp }}/selftest.json
        run: |
          set -o pipefail
          status=0
          ./Examples/dist/SelfTest.app/Contents/MacOS/SelfTest 2>&1 | tee "$RUNNER_TEMP/selftest.log" || status=$?
          {
            echo "### SelfTest: exit status $status"
            if [ -f "$SELFTEST_JSON" ]; then
              jq -r '"\(.passed) passed, \(.failed) failed, skipped: environment \(.skipped.environment), limitation \(.skipped.limitation), uncategorized \(.skipped.uncategorized); \(.durationSeconds | floor) s"' "$SELFTEST_JSON"
            fi
            echo '```'
            grep -E '^(FAIL|SKIP|SUMMARY)|CHECK' "$RUNNER_TEMP/selftest.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # On failure: the full log, the results, and any crash reports from
      # this run (Chromium's helpers report under their own names).
      - name: Collect SelfTest diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp "$RUNNER_TEMP"/selftest.* "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -newer "$GITHUB_WORKSPACE/Package.swift" -type f \
            -exec cp {} "$RUNNER_TEMP/diagnostics/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/diagnostics"

      - name: Upload SelfTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Working tree must stay clean
        run: |
          git diff --exit-code
          UNTRACKED="$(git status --porcelain)"
          if [ -n "$UNTRACKED" ]; then
            echo "Working tree is dirty after the build — add the offenders to .gitignore:"
            echo "$UNTRACKED"
            exit 1
          fi

  # The package and its tests compile for Intel. CefKit loads the CEF
  # framework at run time and the plugin builds the helper only when it
  # bundles, so compiling needs no x86_64 CEF download; bundling and
  # running for Intel would (docs/automation.md#ci).
  intel:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build for x86_64
        run: swift build --build-tests --arch x86_64

      - name: The build is x86_64, for macOS 14
        run: |
          helper="$(swift build --arch x86_64 --show-bin-path)/cefswift-helper"
          lipo -archs "$helper" | tee "$RUNNER_TEMP/archs.txt"
          grep -qx x86_64 "$RUNNER_TEMP/archs.txt"
          xcrun vtool -show-build "$helper" | grep -Eq 'minos 14\.0$'

  # Runs started for an update pull request are dispatched with the workflow
  # token, so a failure notifies nobody and auto-merge just waits. Say so on
  # the pull request.
  report:
    needs: ci
    if: >-
      always() && needs.ci.result == 'failure' && github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'cef-update' || github.ref_name == 'cef-api-update')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the update pull request
        run: |
          if [ "$(gh pr view "$GITHUB_REF_NAME" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr comment "$GITHUB_REF_NAME" --body "CI failed for ${GITHUB_SHA:0:7}, so this will not merge: $RUN_URL (the run summary lists the SelfTest FAIL lines). Push a fix to this branch; later update runs leave it alone until a newer CEF is released."
          fi
