# Builds, tests, audits the C bridge and the CEF XCFramework, bundles
# SelfTest and runs it against the real Chromium. Also the gate for the
# auto-merged CEF update pull requests, which start it with
# workflow_dispatch (docs/automation.md).
#
# Cost notes (keep this cheap):
#   - One macos-15 (arm64) job. The runner is pinned so an image change never
#     arrives unannounced; macos-latest moves, and the XCFramework's checksum
#     is reproduced with the runner's zlib.
#   - The two minimal CEF distributions (~280 MB) are cached in
#     `.cef/downloads`, keyed on the pinned CEF version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the job name "ci": it is the required status check that gates the
    # auto-merged CEF update pull requests.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pins
        id: cef
        run: |
          {
            echo "version=$(jq -r .cef CEF_VERSION.json)"
            echo "tag=$(jq -r .xcframework.tag CEF_VERSION.json)"
          } >> "$GITHUB_OUTPUT"

      # Offline checks of the update and packaging logic (release selection,
      # manifest, archive extraction, API-version handling, the universal
      # merge and the deterministic zip).
      - name: Script self-tests
        run: |
          Scripts/update-cef.py --self-test
          Scripts/package-cef.py --self-test

      # Same key as the update workflow saves, so an update branch restores
      # the archives that workflow already downloaded.
      - name: Cache CEF downloads
        uses: actions/cache@v4
        with:
          path: .cef/downloads
          key: cef-${{ steps.cef.outputs.version }}-minimal

      # Repackages the official distributions and requires the zip to have the
      # checksum Package.swift pins: the hosted framework is the official
      # one, file for file.
      - name: Rebuild the XCFramework
        run: Scripts/package-cef.py --check

      # SwiftPM resolves the binary target from the release asset Package.swift
      # pins, and checks its checksum. On main and the update branches the
      # asset must be published (the update workflow does that before it
      # starts CI). Other branches that pin an unpublished asset build against
      # the rebuilt framework instead, with a warning: publish it before
      # merging.
      - name: The pinned release asset
        env:
          TAG: ${{ steps.cef.outputs.tag }}
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null |
             grep -qx ChromiumEmbeddedFramework.xcframework.zip; then
            exit 0
          fi
          echo "The release $TAG has no ChromiumEmbeddedFramework.xcframework.zip."
          case "$REF" in
            main|cef-update|cef-api-update) exit 1 ;;
          esac
          echo "::warning::The $TAG release asset that Package.swift pins is not published; building against the rebuilt framework. Publish it before merging (docs/automation.md)."
          echo "CEFSWIFT_LOCAL_FRAMEWORK=1" >> "$GITHUB_ENV"

      # The generated bridge must match the vendored headers, and every
      # function it binds must be exported by both architectures of the
      # framework — a mismatch would otherwise abort at first call.
      - name: C bridge matches the headers and the framework
        env:
          FRAMEWORK: .cef/xcframework/ChromiumEmbeddedFramework.xcframework/macos-arm64_x86_64/Chromium Embedded Framework.framework
        run: Scripts/generate-bindings.py --check --framework "$FRAMEWORK"

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Build examples
        run: swift build --package-path Examples

      - name: Bundle SelfTest
        run: |
          swift package --package-path Examples \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef bundle --product SelfTest --configuration release --output dist

      # Runs every end-to-end check against the real Chromium runtime; the
      # app exits with the number of failed checks. FAIL and SKIP lines go to
      # the run summary.
      - name: SelfTest
        shell: bash
        run: |
          set -o pipefail
          status=0
          ./Examples/dist/SelfTest.app/Contents/MacOS/SelfTest | tee "$RUNNER_TEMP/selftest.log" || status=$?
          {
            echo "### SelfTest: $(grep -c '^PASS' "$RUNNER_TEMP/selftest.log") passed, exit status $status"
            echo '```'
            grep -E '^(FAIL|SKIP)|CHECK' "$RUNNER_TEMP/selftest.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Working tree must stay clean
        run: |
          git diff --exit-code
          UNTRACKED="$(git status --porcelain)"
          if [ -n "$UNTRACKED" ]; then
            echo "Working tree is dirty after the build — add the offenders to .gitignore:"
            echo "$UNTRACKED"
            exit 1
          fi

  # Runs started for an update pull request are dispatched with the workflow
  # token, so a failure notifies nobody and auto-merge just waits. Say so on
  # the pull request.
  report:
    needs: ci
    if: >-
      always() && needs.ci.result == 'failure' && github.event_name == 'workflow_dispatch' &&
      (github.ref_name == 'cef-update' || github.ref_name == 'cef-api-update')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comment on the update pull request
        run: |
          if [ "$(gh pr view "$GITHUB_REF_NAME" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr comment "$GITHUB_REF_NAME" --body "CI failed for ${GITHUB_SHA:0:7}, so this will not merge: $RUN_URL (the run summary lists the SelfTest FAIL lines). Push a fix to this branch; later update runs leave it alone until a newer CEF is released."
          fi
