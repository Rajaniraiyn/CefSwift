# Builds, tests, audits the C bridge, bundles SelfTest and runs it against the
# real Chromium. Also the gate for the auto-merged CEF update pull requests,
# which start it with workflow_dispatch (docs/automation.md).
#
# Cost notes (keep this cheap):
#   - One macos-15 (arm64) job. The runner is pinned so an image change never
#     arrives unannounced; macos-latest moves.
#   - Only the minimal arm64 CEF flavor is downloaded, and `.cef/downloads`
#     (~135 MB) is cached keyed on the pinned CEF version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the job name "ci": it is the required status check that gates the
    # auto-merged CEF update pull requests.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned CEF version
        id: cef
        run: echo "version=$(jq -r .cef CEF_VERSION.json)" >> "$GITHUB_OUTPUT"

      # Offline checks of the update logic (release selection, manifest,
      # archive extraction, API-version handling).
      - name: Update script self-test
        run: Scripts/update-cef.py --self-test

      # Same key as the update workflow saves, so an update branch restores
      # the archive that workflow already downloaded.
      - name: Cache CEF downloads
        uses: actions/cache@v4
        with:
          path: .cef/downloads
          key: cef-${{ steps.cef.outputs.version }}-macosarm64-minimal

      - name: Download CEF (minimal, arm64)
        run: |
          swift package \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef download

      # The generated bridge must match the vendored headers, and every
      # function it binds must be exported by the framework it will load —
      # a mismatch would otherwise abort at first call.
      - name: C bridge matches the headers and the framework
        env:
          FRAMEWORK: .cef/dist/${{ steps.cef.outputs.version }}_macosarm64_minimal/Release/Chromium Embedded Framework.framework
        run: Scripts/generate-bindings.py --check --framework "$FRAMEWORK"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build examples
        run: swift build --package-path Examples

      - name: Bundle SelfTest
        run: |
          swift package --package-path Examples \
            --allow-writing-to-package-directory \
            --allow-network-connections all \
            cef bundle --product SelfTest --configuration release --output dist

      # Runs every end-to-end check against the real Chromium runtime; the
      # app exits with the number of failed checks.
      - name: SelfTest
        run: ./Examples/dist/SelfTest.app/Contents/MacOS/SelfTest

      - name: Working tree must stay clean
        run: |
          git diff --exit-code
          UNTRACKED="$(git status --porcelain)"
          if [ -n "$UNTRACKED" ]; then
            echo "Working tree is dirty after the build — add the offenders to .gitignore:"
            echo "$UNTRACKED"
            exit 1
          fi
